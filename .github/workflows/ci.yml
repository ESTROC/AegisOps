name: Java + React CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [incident-service, notification-service, legacy-soap-adapter]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: 'services/${{ matrix.service }}/pom.xml'}
      - name: Test microservice
        working-directory: services/${{ matrix.service }}
        run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install and compile
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [java,frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --env-file .env.example build
