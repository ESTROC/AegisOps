name: Full-stack UI + API regression
on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_BASE_URL: http://127.0.0.1:8088
      TEST_ADMIN_USERNAME: admin
      TEST_ADMIN_PASSWORD: Synthetic-CI-Password-2026-Safe!
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Create ephemeral CI-only configuration
        run: |
          cp .env.example .env
          sed -i 's/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=Synthetic-CI-Password-2026-Safe!/' .env
      - name: Start full-stack test environment
        run: docker compose up -d --build
      - name: Wait for healthy application
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$APP_BASE_URL/actuator/health" | grep -q 'UP'; then exit 0; fi
            sleep 4
          done
          docker compose ps
          docker compose logs --tail=100 incident-service
          exit 1
      - name: Playwright browser and API tests
        working-directory: qa/playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test
      - name: Selenium Java WebDriver smoke suite
        run: mvn -B -f qa/selenium/pom.xml test
      - name: Upload test reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-evidence
          path: |
            qa/playwright/test-results/
            qa/playwright/playwright-report/
            qa/selenium/target/surefire-reports/
          if-no-files-found: ignore
      - name: Dump container state on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=100 incident-service notification-service
      - name: Stop test services
        if: always()
        run: docker compose down --volumes --remove-orphans
