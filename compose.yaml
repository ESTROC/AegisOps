name: aegisops
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: aegisops
      MYSQL_USER: aegisops
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [internal]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Broker is reachable from service containers only; management UI is not exposed publicly.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [internal]
  incident-service:
    build: ./services/incident-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aegisops?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: aegisops
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_BOOTSTRAP_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME}
      APP_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      APP_LEGACY_SOAP_URL: http://legacy-soap-adapter:8083/ws
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      notification-service: {condition: service_started}
      legacy-soap-adapter: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]
  notification-service:
    build: ./services/notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aegisops_notifications?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: aegisops
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [internal]
  legacy-soap-adapter:
    build: ./services/legacy-soap-adapter
    networks: [internal]
  web:
    build: ./web
    depends_on:
      incident-service: {condition: service_healthy}
    ports:
      - "127.0.0.1:8088:80"
    networks: [internal]
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  mysql-data:
