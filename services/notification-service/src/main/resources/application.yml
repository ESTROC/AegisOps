server:
  port: 8082
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aegisops_notifications}
    username: ${SPRING_DATASOURCE_USERNAME:aegisops}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    listener:
      simple:
        default-requeue-rejected: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Kafka connects only when APP_EVENTS_TRANSPORT=kafka; RabbitMQ remains default.
app.events.transport: ${APP_EVENTS_TRANSPORT:rabbit}
spring.kafka.bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset: earliest
logging.structured.format.console: ecs
